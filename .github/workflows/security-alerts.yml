name: Security Alerts

on:
  workflow_call:
    inputs:
      repo-name:
        description: 'Nom du repo pour le message Mattermost'
        required: true
        type: string
      elastic-url:
        description: "Endpoint Elasticsearch (variable ELASTIC_URL du repo) ; vide = pas d'envoi"
        required: false
        type: string
        default: ''
      envoi-mattermost:
        description: "Envoi Mattermost (variable CVE_ENVOI_MATTERMOST du repo, false pour le couper)"
        required: false
        type: boolean
        default: true
      envoi-elasticsearch:
        description: "Envoi Elasticsearch (variable CVE_ENVOI_ELASTICSEARCH du repo, false pour le couper)"
        required: false
        type: boolean
        default: true
    secrets:
      DEPENDABOT_ALERTS_READER:
        required: true
      MATTERMOST_WEBHOOK_URL:
        required: false
      ELASTIC_ALERTES_GITHUB_API_KEY:
        required: false

jobs:
  check-cves:
    name: Check CVEs high/critical
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    env:
      MATTERMOST_ACTIF: ${{ inputs.envoi-mattermost && secrets.MATTERMOST_WEBHOOK_URL != '' }}
      ELASTIC_ACTIF: ${{ inputs.envoi-elasticsearch && secrets.ELASTIC_ALERTES_GITHUB_API_KEY != '' && inputs.elastic-url != '' }}

    steps:
      - name: Fetch Dependabot alerts (high/critical)
        id: fetch-alerts
        run: |
          echo "🔍 Recherche des CVEs high/critical ouvertes..."

          # Récupérer les alertes high/critical ouvertes via l'API Dependabot
          alerts=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/dependabot/alerts?state=open" \
            --jq '[.[] | select((.security_advisory.severity == "high" or .security_advisory.severity == "critical") and .dependency.scope == "runtime")]')

          alert_count=$(echo "$alerts" | jq 'length')

          if [ "$alert_count" -eq 0 ]; then
            echo "✅ Aucune CVE high/critical ouverte"
            echo "has_alerts=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "⚠️  $alert_count CVE(s) high/critical trouvée(s)"
          echo "has_alerts=true" >> $GITHUB_OUTPUT
          echo "alert_count=$alert_count" >> $GITHUB_OUTPUT

          # Sauvegarder les alertes
          echo "$alerts" > /tmp/alerts.json
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_READER }}

      - name: Send Mattermost alert
        if: steps.fetch-alerts.outputs.has_alerts == 'true' && env.MATTERMOST_ACTIF == 'true'
        run: |
          echo "📤 Envoi alerte Mattermost..."

          alerts=$(cat /tmp/alerts.json)
          alert_count=$(echo "$alerts" | jq 'length')

          # Construire la liste des CVEs
          cve_list=$(echo "$alerts" | jq -r '.[] | "• **\(.security_advisory.cve_id // "No CVE")** - \(.dependency.package.name) (\(.security_advisory.severity)): \(.security_advisory.summary) - [Voir](\(.html_url))"' | head -n 10)

          if [ "$alert_count" -gt 10 ]; then
            cve_list="${cve_list}\n• ... et $((alert_count - 10)) autre(s)"
          fi

          # Nom du repo (depuis input ou depuis github.repository)
          repo_name="${{ inputs.repo-name }}"
          if [ -z "$repo_name" ]; then
            repo_name="${{ github.event.repository.name }}"
          fi

          # Envoyer à Mattermost
          curl -X POST "$MATTERMOST_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d @- <<EOF
          {
            "text": "@here :rotating_light: **$alert_count CVE(s) high/critical sur ${repo_name}**",
            "attachments": [
              {
                "color": "#FF0000",
                "text": "${cve_list}\n\n[Voir toutes les alertes](https://github.com/${{ github.repository }}/security/dependabot)"
              }
            ]
          }
          EOF

          echo "✅ Alerte envoyée"
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}

      - name: Send alerts to Elasticsearch
        if: steps.fetch-alerts.outputs.has_alerts == 'true' && env.ELASTIC_ACTIF == 'true'
        run: |
          echo "📤 Envoi des CVEs à Elasticsearch..."

          repo_name="${{ inputs.repo-name }}"
          if [ -z "$repo_name" ]; then
            repo_name="${{ github.event.repository.name }}"
          fi

          jq -c --arg repo "$repo_name" '.[] | {"create": {}}, (. + {"repository": $repo})' /tmp/alerts.json > /tmp/alerts.ndjson

          response=$(curl -sS --fail-with-body -X POST "${ELASTIC_URL%/}/logs-alertes-github-default/_bulk" \
            -H "Authorization: ApiKey $ELASTIC_ALERTES_GITHUB_API_KEY" \
            -H 'Content-Type: application/x-ndjson' \
            --data-binary @/tmp/alerts.ndjson)

          if [ "$(echo "$response" | jq '.errors')" != "false" ]; then
            echo "❌ Rejet par Elasticsearch :"
            echo "$response" | jq -c '[.items[].create | select(.error) | .error.reason]'
            exit 1
          fi

          echo "✅ $(echo "$response" | jq '.items | length') CVE(s) envoyée(s)"
        env:
          ELASTIC_URL: ${{ inputs.elastic-url }}
          ELASTIC_ALERTES_GITHUB_API_KEY: ${{ secrets.ELASTIC_ALERTES_GITHUB_API_KEY }}
