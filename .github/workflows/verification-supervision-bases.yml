# Vérifie contre la prod la supervision des bases : chaque requête des dashboards
# « [Pass Emploi] Bases de données » s'exécute sur les vraies données et rend les colonnes
# du catalogue, et les intégrations Fleet de l'agent dédié n'ont pas divergé des fichiers
# générés (modification faite à la main dans Fleet). Chaque jour, ou à la main après une
# poussée. Lecture seule : rien n'est écrit dans Kibana ni dans Fleet.
#
# Pas de déclencheur pull_request : le code d'une PR s'exécuterait avec la clé de lecture,
# et une PR qui modifie un modèle diverge de la prod tant que la poussée n'est pas faite.

name: Supervision - Bases de données vérifiées contre la prod

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Dashboards et intégrations Fleet des bases conformes à la prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Performance
    env:
      ES_URL: ${{ vars.ES_URL }}
      KIBANA_URL: ${{ vars.KIBANA_URL }}
      ES_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY_RESTRICTED_READ_ONLY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # La clé de la CI ne lit pas le texte des logs de l'agent (field_security) : la requête des erreurs de l'agent est ignorée.
      - name: Requêtes des dashboards valides sur les données de prod
        run: python3 -I docs/observabilite/supervision/dashboards/generer-dashboards-bases.py --valider --sauf logs-elastic_agent

      - name: Intégrations Fleet de prod identiques aux fichiers générés
        if: always()
        run: python3 -I docs/observabilite/supervision/agents/generer-integrations.py verifier --env prod
