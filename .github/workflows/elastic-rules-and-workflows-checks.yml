# Vérifie les règles d'alerte Kibana, les Workflows Kibana qui envoient ces alertes dans
# Tchap, les intégrations Fleet de l'agent dédié et les dashboards des bases
# (kibana/rules/, workflows/tchap/, agents/, dashboards/) : leurs
# fichiers générés doivent correspondre à leurs sources, et passer les contrôles et les
# tests des générateurs.
#
# Les générateurs se lancent à la main (cf. kibana/workflows/tchap/README.md) :
# ce workflow échoue si l'un d'eux a été oublié, ou si une règle viole une de leurs
# règles (message absent ou en JSON invalide, salon inconnu, règle ES|QL hors @timestamp).
#
# generer-notifications-tchap.py lit la liste des CRON dans pass-emploi-api (origin/develop) pour
# le rapport des jobs : le repo est récupéré à côté, comme sur un poste de dev. Un CRON
# ajouté dans l'api fait donc échouer ce contrôle tant que le rapport n'est pas régénéré.
#
# Aucun accès à Kibana ni à la prod : le déploiement reste manuel.

name: Supervision - Règles d'alerte Kibana et Workflows Tchap à jour avec leurs sources

on:
  pull_request:
    paths:
      - 'kibana/**'
      - '.github/workflows/elastic-rules-and-workflows-checks.yml'
  push:
    branches: [master]
    paths:
      - 'kibana/**'
      - '.github/workflows/elastic-rules-and-workflows-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Règles d'alerte Kibana et Workflows Tchap à jour avec leurs générateurs
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer pass-emploi-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pass-emploi-tools

      - name: Récupérer pass-emploi-api (liste des CRON)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: France-Travail/pass-emploi-api
          ref: develop
          path: pass-emploi-api

      - name: Référence origin/develop de pass-emploi-api
        run: git -C pass-emploi-api fetch --depth=1 origin +develop:refs/remotes/origin/develop

      - name: Tests des générateurs
        working-directory: pass-emploi-tools
        run: python3 -I -m unittest discover -s kibana/tests -v

      - name: Règles générées à jour (rules/generated/)
        working-directory: pass-emploi-tools/kibana
        run: |
          if ! python3 -I rules/scripts/generer-regles-alerting.py --verifier; then
            echo "::error::Les fichiers de kibana/rules/generated/ ne correspondent plus à leurs sources. Ils sont générés : ne pas les modifier directement. Modifier la règle (rules/<n>-<périmètre>/<code>.json) ou le texte autour (rules/<n>-<périmètre>/_modele.console), puis lancer python3 -I kibana/rules/scripts/generer-regles-alerting.py et commiter le résultat."
            exit 1
          fi

      - name: Workflows Tchap et rapports des jobs à jour (workflows/tchap/generated/)
        working-directory: pass-emploi-tools
        run: |
          python3 -I kibana/rules/scripts/generer-notifications-tchap.py
          if ! git diff --exit-code --stat -- kibana/workflows/tchap/generated/; then
            echo "::error::Les fichiers de kibana/workflows/tchap/generated/ ne correspondent plus à leurs sources. Ils sont générés : ne pas les modifier directement. Lancer python3 -I kibana/rules/scripts/generer-notifications-tchap.py et commiter le résultat."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- kibana/workflows/tchap/generated/)" ]; then
            git status --short -- kibana/workflows/tchap/generated/
            echo "::error::Fichiers générés non commités : les ajouter à la PR"
            exit 1
          fi

      - name: Intégrations Fleet et dashboards des bases à jour (agents/generated/, dashboards/)
        working-directory: pass-emploi-tools
        run: |
          python3 -I kibana/agents/generer-integrations.py
          python3 -I kibana/dashboards/generer-dashboards-bases.py
          generes="kibana/agents/generated/ kibana/dashboards/dashboard-bases-de-donnees.ndjson"
          if ! git diff --exit-code --stat -- $generes; then
            echo "::error::Les intégrations Fleet ou les dashboards des bases ne correspondent plus à leurs sources. Ils sont générés : ne pas les modifier directement. Lancer generer-integrations.py et generer-dashboards-bases.py (python3 -I) et commiter le résultat."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- $generes)" ]; then
            git status --short -- $generes
            echo "::error::Fichiers générés non commités : les ajouter à la PR"
            exit 1
          fi
