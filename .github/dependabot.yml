version: 2

updates:
  - package-ecosystem: docker
    directory: /perf
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: pip
    directory: /perf/mock-externes
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: gradle
    directory: /perf
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
