# Pipeline INGEST — reçoit le drain HTTP Scalingo et relaie tel quel vers le
# pipeline `process`. AUCUN filtre ici : l'ACK renvoyé au drain doit être rapide
# et CONSTANT, indépendant du coût de parsing et de l'état d'Elasticsearch.
#
# C'est ce qui supprime la cause racine de la quarantaine drain (mode B) : avant,
# les filtres lourds (kv/json/ruby/regex) tournaient sur le chemin d'ACK de
# l'input http → un batch lent = ACK lent = 499 = 10 échecs consécutifs sur
# pass-emploi-api = 5 min de blackout. Ici l'ACK ne dépend plus que de l'enqueue
# vers `process`. cf. docs/blackout-logs/postmortem-2026-07.md §7 (Option A).

input {
  http {
    port => "${PORT}"
    user => "${USER}"
    password => "${PASSWORD}"
    additional_codecs => { "application/json" => "plain" }
  }
}

output {
  pipeline { send_to => ["process"] }
}
