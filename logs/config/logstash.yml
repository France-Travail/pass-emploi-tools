# Configuration globale Logstash.
#
# Chargé via --path.settings /app/config (cf. Procfile).
# Les paramètres pipeline-spécifiques (workers, batch, queue) sont dans
# config/pipelines-ingest.yml et config/pipelines-process.yml — assemblés
# dynamiquement dans /app/config/pipelines.yml au démarrage par start.sh
# selon les variables INGEST_ENABLED / PROCESS_ENABLED.
#
# Cf. docs/blackout-logs/conventions.md pour le contexte de l'architecture
# 2 services Logstash + Redis.

# --- Chemins ---
# Logstash sur Scalingo est déployé dans /app (buildpack).
# Les pipelines sont à la racine de /app (pas dans /app/config) car Scalingo
# déploie les fichiers du repo à la racine de /app.
path.data: /app/data
path.logs: /app/logs

# --- Pipelines ---
# Pointe sur le fichier généré dynamiquement par start.sh à chaque démarrage.
# Ce fichier est assemblé depuis config/pipelines-ingest.yml et/ou
# config/pipelines-process.yml selon INGEST_ENABLED / PROCESS_ENABLED.
path.pipelines: /app/config/pipelines.yml

# --- Reload automatique ---
# Activé via --config.reload.automatic dans le Procfile.
# Intervalle de vérification des changements de config.
config.reload.interval: 3s

# --- Logs Logstash lui-même ---
# "warn" pour réduire le bruit dans les logs Scalingo.
# Passer à "info" temporairement pour diagnostiquer un problème de démarrage.
log.level: warn
log.format: json

# --- Monitoring Logstash ---
# xpack.monitoring est deprecated depuis Logstash 8.x et supprimé en 9.x.
# La solution recommandée est Elastic Agent Fleet avec l'intégration Logstash,
# qui collecte les métriques via l'API locale /_node/stats (port 9600).
# Cf. https://www.elastic.co/docs/reference/logstash/monitoring-logstash-with-elastic-agent
# API locale utilisée par Elastic Agent pour collecter les métriques.
api.enabled: true
api.http.host: "127.0.0.1"
api.http.port: 9600
# Permet de distinguer facilement les environnements dans l'API.
api.environment: "${ENVIRONMENT}"
