# Pipeline "ingest" — recevoir uniquement, zéro traitement.
#
# Rôle : ACK le drain Scalingo le plus vite possible (écriture disque ~1ms),
# puis passer la main au pipeline "process" via la Persistent Queue.
#
# RÈGLE ABSOLUE : ne jamais ajouter de filtre ici. Chaque filtre ajouté
# rallonge l'ACK et risque de réintroduire la quarantaine du drain.
# Les seuls drops autorisés sont ceux qui évitent de stocker des événements
# qu'on va de toute façon jeter (health checks évidents) — et encore,
# uniquement si le pattern est trivial (pas de regex lourde).
#
# Cf. docs/blackout-logs/conventions.md — "Cause structurelle à casser".

input {
  http {
    port     => "${PORT}"
    user     => "${USER}"
    password => "${PASSWORD}"
    # Le drain Scalingo envoie du JSON brut en body ; on le reçoit tel quel
    # (plain) pour ne pas payer le coût de parsing ici.
    additional_codecs => { "application/json" => "plain" }
    # Threads Netty (I/O réseau, distinct des workers Logstash).
    # Défaut Logstash : CPU×2 détecté sur l'hôte Scalingo (non garanti).
    # LOGSTASH_INGEST_THREADS permet de fixer une valeur stable indépendamment
    # du nombre de cœurs de l'hôte physique sous-jacent.
    threads => "${LOGSTASH_INGEST_THREADS:4}"
  }
}

# Zéro filtre — intentionnel. Voir commentaire en tête de fichier.

output {
  # Transmission au pipeline "process" via la Persistent Queue.
  # La PQ est configurée dans pipelines.yml (queue.type: persisted, 512mb).
  pipeline {
    send_to => ["process"]
  }
}
