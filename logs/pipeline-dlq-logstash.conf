# Pipeline "dead_letter_queue" — consommation et indexation des événements en erreur.
#
# Lit les événements placés dans la Dead Letter Queue du pipeline "process"
# lorsqu'une erreur non récupérable empêche leur traitement normal
# (erreur de condition, rejet Elasticsearch éligible à la DLQ, etc.).
#
# Les événements sont reformattés pour conserver le contexte de l'erreur,
# la cause Logstash et le payload d'origine avant d'être indexés dans
# un index Elasticsearch dédié à la DLQ.
#
# Ce pipeline consomme la DLQ en continu et valide les offsets après lecture.
# Les segments déjà consommés peuvent ainsi être supprimés du disque local
# éphémère Scalingo après leur persistance dans Elasticsearch.
#
# Cf. docs/blackout-logs/conventions.md pour le contexte complet.

input {
  dead_letter_queue {
    id => "process_dlq"
    path => "/app/data/dead_letter_queue"
    pipeline_id => "process"

    # Reprend là où le reader s'était arrêté
    commit_offsets => true

    # Supprime du disque les segments déjà exportés dans Elasticsearch
    clean_consumed => true
  }
}

filter {
  ruby {
    id => "format_process_dlq"

    code => '
      # Métadonnées ajoutées par le dead_letter_queue input.
      reason      = event.get("[@metadata][dead_letter_queue][reason]")
      plugin_id   = event.get("[@metadata][dead_letter_queue][plugin_id]")
      plugin_type = event.get("[@metadata][dead_letter_queue][plugin_type]")
      entry_time  = event.get("[@metadata][dead_letter_queue][entry_time]")

      # Informations utiles de l événement original que l on souhaite
      # conserver comme champs directement recherchables dans Elasticsearch.
      original_timestamp = event.get("@timestamp")
      event_created      = event.get("[event][created]")

      environment =
        event.get("[service][environment]") ||
        event.get("[@metadata][env]") ||
        "unknown"

      service_name      = event.get("[service][name]")
      service_node_name = event.get("[service][node][name]")

      timestamp_creation_source =
        event.get("[labels][timestamp_creation_source]") ||
        event.get("[@metadata][timestamp_creation_source]")

      original_tags = event.get("tags")

      # Sauvegarde de l événement tel qu il se trouvait au moment où il
      # a été lu depuis la DLQ.
      #
      # On le sérialise en JSON afin qu une structure ou un type de champ
      # ayant justement provoqué un rejet Elasticsearch ne puisse pas
      # reproduire le même conflit de mapping dans l index DLQ.
      original = event.to_hash
      original.delete("@metadata")
      original_json = LogStash::Json.dump(original)

      # Reconstruction d un document DLQ volontairement simple et stable.
      event.to_hash.keys.each { |key| event.remove(key) }

      # Chronologie ECS.
      #
      # @timestamp reste la date métier de l événement original.
      # Il ne doit pas être remplacé par la date d entrée dans la DLQ,
      # notamment pour conserver la chronologie correcte lors des rejeux.
      event.set("@timestamp", original_timestamp) if original_timestamp
      event.set("[event][created]", event_created) if event_created

      # Payload complet de l événement fautif.
      event.set("[event][original]", original_json)

      # Identification ECS du service.
      event.set("[service][environment]", environment)
      event.set("[service][name]", service_name) if service_name
      event.set("[service][node][name]", service_node_name) if service_node_name

      # Provenance de @timestamp, lorsqu elle était disponible au moment
      # de l erreur.
      if timestamp_creation_source
        event.set(
          "[labels][timestamp_creation_source]",
          timestamp_creation_source
        )
      end

      # Conservation des tags éventuellement déjà présents sur l événement
      # (_mutate_error, _jsonparsefailure, etc.).
      event.set("tags", original_tags) if original_tags

      # Métadonnées spécifiques à Logstash / DLQ.
      event.set("[logstash][dlq][source_pipeline]", "process")
      event.set("[logstash][dlq][entry_time]", entry_time) if entry_time
      event.set("[logstash][dlq][reason]", reason) if reason
      event.set("[logstash][dlq][plugin_id]", plugin_id) if plugin_id
      event.set("[logstash][dlq][plugin_type]", plugin_type) if plugin_type
    '
  }
}

output {
  elasticsearch {
    hosts  => ["${ELASTICSEARCH_URL}"]
    index  => "logs-logstash-dlq-%{[service][environment]}-default"
    action => "create"
  }
}
