# ⚠️ NE PAS METTRE DE CONFIG ICI — fichier volontairement vide.
#
# Ce fichier n'existe QUE pour satisfaire le `bin/detect` du buildpack Scalingo
# (https://github.com/Scalingo/logstash-buildpack), qui refuse de builder l'app
# si `logstash.conf` est absent à la racine :
#
#     if [ -f $1/logstash.conf ] ; then echo "Logstash"; exit 0; fi
#     exit 1
#
# La vraie configuration vit dans l'architecture 2 pipelines :
#   - config/pipelines.yml  (déclare `ingest` + `process`, PQ sur `process`)
#   - ingest.conf           (http input → pipeline output, ACK rapide)
#   - process.conf          (pipeline input → filtres ECS → Elasticsearch)
#
# Le Procfile lance `bin/logstash` SANS `-f` → pipelines.yml est auto-découvert
# et CE fichier n'est jamais chargé. Le laisser vide est intentionnel : s'il était
# lancé par erreur via `-f logstash.conf`, Logstash échoue bruyamment (pipeline
# vide) plutôt que de démarrer une ingestion silencieusement inerte.
#
# cf. docs/blackout-logs/ (postmortem & conventions).
